<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 304" role="img" aria-labelledby="t d">
<title id="t">The binary digits of 13 decide which of five multiplications the rewrite inserts</title>
<desc id="d">A table of the rewrite's loop on exponent 13, giving the product and the square after each pass. At the start, the square is the function's input x, printed as %1, and there is no product. Pass 1: exponent 13, binary 1101, lowest digit 1, so x becomes the product without a multiplication; the square becomes x squared, inserting %2 = arith.mul(%1, %1). Pass 2: exponent 6, binary 110, lowest digit 0, so the product stays x; the square becomes x to the fourth, inserting %3 = arith.mul(%2, %2). Pass 3: exponent 3, binary 11, lowest digit 1, so the product becomes x to the fifth, inserting %4 = arith.mul(%1, %3); the square becomes x to the eighth, inserting %5 = arith.mul(%3, %3). Pass 4: exponent 1, binary 1, lowest digit 1, so the product becomes x to the thirteenth, inserting %6 = arith.mul(%4, %5); the exponent reaches 0, so the loop stops and the square stays x to the eighth. Digits equal to 1 and the products they change are marked in red. After the loop, replaceOp moves the uses of calc.powi to %6.</desc>
<defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,1 L10,5 L0,9 z"/></marker><marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head acc-fill" d="M0,1 L10,5 L0,9 z"/></marker></defs>
<style>
.h{font:15px 'Century Supra','Century Schoolbook','New Century Schoolbook',Georgia,serif;fill:#1a1714}
.t{font:14px 'Century Supra','Century Schoolbook','New Century Schoolbook',Georgia,serif;fill:#564e44}
.c{font:15px ui-monospace,'SF Mono',Menlo,Consolas,monospace;fill:#1a1714}
.cs{font:14px ui-monospace,'SF Mono',Menlo,Consolas,monospace;fill:#1a1714}
.cm{font:14px ui-monospace,'SF Mono',Menlo,Consolas,monospace;fill:#564e44}
.acc{fill:#d2371f}
.gone{opacity:0.7}
.user{fill:#ece8dd;stroke:#1a1714;stroke-width:1.4}
.made{fill:#ece8dd;stroke:#564e44;stroke-width:1.2;stroke-dasharray:4 3}
.made.hot{stroke:#d2371f;stroke-width:1.6}
.line{fill:none;stroke:#564e44;stroke-width:1.2}
.line.hot{stroke:#d2371f;stroke-width:1.5}
.strike{stroke:#564e44;stroke-width:1.2}
.head{fill:#564e44} .acc-fill{fill:#d2371f}
.rule{stroke:rgba(26,23,20,0.3);stroke-width:1}
@media (prefers-color-scheme: dark){
.h,.c,.cs{fill:#ece3d2} .t,.cm{fill:#b0a692} .acc{fill:#fe5a44}
.user{fill:#1e1b15;stroke:#ece3d2} .made{fill:#1e1b15;stroke:#b0a692}
.made.hot{stroke:#fe5a44} .line{stroke:#b0a692} .line.hot{stroke:#fe5a44}
.strike{stroke:#b0a692} .head{fill:#b0a692} .acc-fill{fill:#fe5a44}
.rule{stroke:rgba(236,227,210,0.28)}
}
</style>
<text class="t" x="311" y="16" text-anchor="middle">after the pass</text>
<line class="rule" x1="250" y1="25" x2="372" y2="25"/>
<text class="t" x="18" y="44" text-anchor="middle">pass</text>
<text class="t" x="52" y="44">exponent (binary)</text>
<text class="t" x="206" y="44" text-anchor="middle">lowest digit</text>
<text class="t" x="276" y="44" text-anchor="middle">product</text>
<text class="t" x="346" y="44" text-anchor="middle">square</text>
<text class="t" x="400" y="44">inserted before calc.powi</text>
<line class="rule" x1="0" y1="56" x2="720" y2="56"/>
<text class="t" x="18" y="82" text-anchor="middle">start</text>
<text class="t" x="276" y="82" text-anchor="middle">none</text>
<text class="cs" x="346" y="82" text-anchor="middle">x</text>
<text class="t" x="400" y="82"><tspan class="cs">%1</tspan> is the function’s input, <tspan class="cs">x</tspan></text>
<text class="t" x="18" y="116" text-anchor="middle">1</text>
<text class="cs" x="52" y="116">13 (1101)</text>
<text class="cs acc" x="206" y="116" text-anchor="middle">1</text>
<text class="cs acc" x="276" y="116" text-anchor="middle">x</text>
<text class="cs" x="346" y="116" text-anchor="middle">x²</text>
<text class="cs" x="400" y="116">%2 = arith.mul(%1, %1)</text>
<text class="t" x="610" y="116">x²</text>
<text class="t" x="18" y="150" text-anchor="middle">2</text>
<text class="cs" x="52" y="150">6 (110)</text>
<text class="cs" x="206" y="150" text-anchor="middle">0</text>
<text class="cm" x="276" y="150" text-anchor="middle">x</text>
<text class="cs" x="346" y="150" text-anchor="middle">x⁴</text>
<text class="cs" x="400" y="150">%3 = arith.mul(%2, %2)</text>
<text class="t" x="610" y="150">x⁴</text>
<text class="t" x="18" y="184" text-anchor="middle">3</text>
<text class="cs" x="52" y="184">3 (11)</text>
<text class="cs acc" x="206" y="184" text-anchor="middle">1</text>
<text class="cs acc" x="276" y="184" text-anchor="middle">x⁵</text>
<text class="cs" x="346" y="184" text-anchor="middle">x⁸</text>
<text class="cs" x="400" y="184">%4 = arith.mul(%1, %3)</text>
<text class="t" x="610" y="184">x⁵</text>
<text class="cs" x="400" y="208">%5 = arith.mul(%3, %3)</text>
<text class="t" x="610" y="208">x⁸</text>
<text class="t" x="18" y="242" text-anchor="middle">4</text>
<text class="cs" x="52" y="242">1 (1)</text>
<text class="cs acc" x="206" y="242" text-anchor="middle">1</text>
<text class="cs acc" x="276" y="242" text-anchor="middle">x¹³</text>
<text class="cm" x="346" y="242" text-anchor="middle">x⁸</text>
<text class="cs" x="400" y="242">%6 = arith.mul(%4, %5)</text>
<text class="t" x="610" y="242">x¹³</text>
<line class="rule" x1="0" y1="264" x2="720" y2="264"/>
<text class="t" x="0" y="290">After the loop, <tspan class="cs">replaceOp</tspan> moves the uses of <tspan class="cs">calc.powi</tspan> to the product, <tspan class="cs">%6</tspan>.</text>
</svg>
