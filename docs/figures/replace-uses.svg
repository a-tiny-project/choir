<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 334" role="img" aria-labelledby="t d">
<title id="t">replaceOp moves the return's use from calc.powi to the last multiplication, and the driver erases calc.powi</title>
<desc id="d">Two listings of power13 inside the rewrite. Left, before replaceOp: after the block argument %1, the five inserted multiplications %2 to %6 (dashed outlines) precede the author's %7 = calc.powi(%1) (solid outline), and func.return(%7) uses calc.powi's result. A red arrow runs from %7 to the return; %7 has 1 use and %6 has no uses. Right, after replaceOp and the rewrite driver's erasure of the obsolete operation: the return reads func.return(%6), the red arrow runs from %6, which now has 1 use, and calc.powi is struck through and faded, marked erased.</desc>
<defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,1 L10,5 L0,9 z"/></marker><marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head acc-fill" d="M0,1 L10,5 L0,9 z"/></marker></defs>
<style>
.h{font:15px 'Century Supra','Century Schoolbook','New Century Schoolbook',Georgia,serif;fill:#1a1714}
.t{font:14px 'Century Supra','Century Schoolbook','New Century Schoolbook',Georgia,serif;fill:#564e44}
.c{font:15px ui-monospace,'SF Mono',Menlo,Consolas,monospace;fill:#1a1714}
.cs{font:14px ui-monospace,'SF Mono',Menlo,Consolas,monospace;fill:#1a1714}
.cm{font:14px ui-monospace,'SF Mono',Menlo,Consolas,monospace;fill:#564e44}
.acc{fill:#d2371f}
.gone{opacity:0.7}
.user{fill:#ece8dd;stroke:#1a1714;stroke-width:1.4}
.made{fill:#ece8dd;stroke:#564e44;stroke-width:1.2;stroke-dasharray:4 3}
.made.hot{stroke:#d2371f;stroke-width:1.6}
.line{fill:none;stroke:#564e44;stroke-width:1.2}
.line.hot{stroke:#d2371f;stroke-width:1.5}
.strike{stroke:#564e44;stroke-width:1.2}
.head{fill:#564e44} .acc-fill{fill:#d2371f}
.rule{stroke:rgba(26,23,20,0.3);stroke-width:1}
@media (prefers-color-scheme: dark){
.h,.c,.cs{fill:#ece3d2} .t,.cm{fill:#b0a692} .acc{fill:#fe5a44}
.user{fill:#1e1b15;stroke:#ece3d2} .made{fill:#1e1b15;stroke:#b0a692}
.made.hot{stroke:#fe5a44} .line{stroke:#b0a692} .line.hot{stroke:#fe5a44}
.strike{stroke:#b0a692} .head{fill:#b0a692} .acc-fill{fill:#fe5a44}
.rule{stroke:rgba(236,227,210,0.28)}
}
</style>
<text class="h" x="0" y="18">Before <tspan class="c">replaceOp</tspan></text>
<text class="cm" x="0" y="67">^bb0(%1: !arith.i64):</text>
<g>
<rect class="made" x="0" y="81" width="209.5" height="26" rx="3"/>
<text class="cs" x="12" y="99">%2 = arith.mul(%1, %1)</text>
</g>
<g>
<rect class="made" x="0" y="113" width="209.5" height="26" rx="3"/>
<text class="cs" x="12" y="131">%3 = arith.mul(%2, %2)</text>
</g>
<g>
<rect class="made" x="0" y="145" width="209.5" height="26" rx="3"/>
<text class="cs" x="12" y="163">%4 = arith.mul(%1, %3)</text>
</g>
<g>
<rect class="made" x="0" y="177" width="209.5" height="26" rx="3"/>
<text class="cs" x="12" y="195">%5 = arith.mul(%3, %3)</text>
</g>
<g>
<rect class="made" x="0" y="209" width="209.5" height="26" rx="3"/>
<text class="cs" x="12" y="227">%6 = arith.mul(%4, %5)</text>
</g>
<g>
<rect class="user" x="0" y="241" width="175.7" height="26" rx="3"/>
<text class="cs" x="12" y="259">%7 = calc.powi(%1)</text>
</g>
<text class="cs" x="0" y="291">func.return(<tspan class="cs acc">%7</tspan>)</text>
<path class="line hot" d="M179.7,254 L242,254 Q252,254 252,264 L252,276 Q252,286 242,286 L138.4,286" marker-end="url(#ha)"/>
<text class="t" x="264" y="227">no uses</text>
<text class="t acc" x="264" y="259">1 use</text>
<line class="rule" x1="362" y1="0" x2="362" y2="334"/>
<text class="h" x="378" y="18">After <tspan class="c">replaceOp</tspan> and erasure</text>
<text class="cm" x="378" y="67">^bb0(%1: !arith.i64):</text>
<g>
<rect class="made" x="378" y="81" width="209.5" height="26" rx="3"/>
<text class="cs" x="390" y="99">%2 = arith.mul(%1, %1)</text>
</g>
<g>
<rect class="made" x="378" y="113" width="209.5" height="26" rx="3"/>
<text class="cs" x="390" y="131">%3 = arith.mul(%2, %2)</text>
</g>
<g>
<rect class="made" x="378" y="145" width="209.5" height="26" rx="3"/>
<text class="cs" x="390" y="163">%4 = arith.mul(%1, %3)</text>
</g>
<g>
<rect class="made" x="378" y="177" width="209.5" height="26" rx="3"/>
<text class="cs" x="390" y="195">%5 = arith.mul(%3, %3)</text>
</g>
<g>
<rect class="made" x="378" y="209" width="209.5" height="26" rx="3"/>
<text class="cs" x="390" y="227">%6 = arith.mul(%4, %5)</text>
</g>
<g class="gone">
<rect class="user" x="378" y="241" width="175.7" height="26" rx="3"/>
<text class="cs" x="390" y="259">%7 = calc.powi(%1)</text>
<line class="strike" x1="374" y1="254" x2="557.7" y2="254"/>
</g>
<text class="cs" x="378" y="291">func.return(<tspan class="cs acc">%6</tspan>)</text>
<path class="line hot" d="M591.5,222 L620,222 Q630,222 630,232 L630,276 Q630,286 620,286 L516.5,286" marker-end="url(#ha)"/>
<text class="t acc" x="642" y="227">1 use</text>
<text class="t" x="642" y="259">erased</text>
</svg>
